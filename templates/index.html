<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yt-steno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>

<main class="wrap">

  <header class="hero">
    <p class="eyebrow">runs on your machine &middot; yt-dlp</p>
    <h1>yt-steno</h1>
    <p class="tagline">Feed a whole channel's spoken words to your AI. Point it at a channel, pull clean transcripts, hand them over.</p>
  </header>

  <section class="panel" id="input-panel">
    <form id="run-form">
      <div class="url-row">
        <input type="text" id="url" name="url" placeholder="Channel, playlist, or video URL — youtube.com/@name, /watch?v=..., youtu.be/..."  autocomplete="off">
        <button type="submit" class="btn btn-primary" id="fetch-btn">Fetch transcripts</button>
      </div>

      <div class="quick-options">
        <label class="opt">
          <span>Language</span>
          <input type="text" id="opt-lang" value="en" maxlength="8">
        </label>
        <label class="opt opt-check">
          <input type="checkbox" id="opt-auto" checked>
          <span>Auto-captions</span>
        </label>
        <label class="opt opt-check">
          <input type="checkbox" id="opt-shorts" checked>
          <span>Include shorts</span>
        </label>
        <label class="opt">
          <span>Video limit</span>
          <input type="number" id="opt-limit" value="0" min="0" placeholder="all">
        </label>
        <button type="button" class="btn btn-ghost btn-sm" id="toggle-advanced">More options</button>
      </div>

      <div class="advanced-options hidden" id="advanced-options">
        <label class="opt">
          <span>Parallel workers <em>(higher = faster, more likely to trip a bot check)</em></span>
          <input type="number" id="opt-workers" value="3" min="1" max="8">
        </label>
        <label class="opt">
          <span>Pause between requests, seconds</span>
          <input type="number" id="opt-pause" value="0.6" min="0" max="5" step="0.1">
        </label>
        <label class="opt">
          <span>Read cookies from browser <em>(needed if YouTube asks for sign-in)</em></span>
          <select id="opt-browser">
            <option value="">none</option>
            <option value="chrome">Chrome</option>
            <option value="firefox">Firefox</option>
            <option value="brave">Brave</option>
            <option value="edge">Edge</option>
            <option value="safari">Safari</option>
          </select>
        </label>
        <label class="opt">
          <span>Bundle size, characters <em>(~4 chars per token)</em></span>
          <input type="number" id="opt-bundle-chars" value="300000" min="20000" step="10000">
        </label>
        <label class="opt opt-check">
          <input type="checkbox" id="opt-timestamps">
          <span>Keep timestamps in bundles</span>
        </label>
      </div>
    </form>
    <p class="hint" id="input-hint"></p>
  </section>

  <section class="panel hidden" id="log-panel">
    <div class="log-panel-head">
      <h2 id="log-heading">fetching transcripts</h2>
      <button type="button" class="btn btn-ghost btn-sm" id="cancel-btn">Cancel</button>
    </div>
    <div class="cue-log" id="cue-log" aria-live="polite"></div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text">0 / 0</span>
    </div>
  </section>

  <section class="panel hidden" id="stats-panel">
    <div class="stat"><span class="stat-value" id="stat-videos">0</span><span class="stat-label">videos</span></div>
    <div class="stat"><span class="stat-value" id="stat-captioned">0</span><span class="stat-label">captioned</span></div>
    <div class="stat"><span class="stat-value" id="stat-words">0</span><span class="stat-label">words</span></div>
    <div class="stat"><span class="stat-value" id="stat-tokens">0</span><span class="stat-label">est. tokens</span></div>
    <div class="stat"><span class="stat-value" id="stat-bundles">0</span><span class="stat-label">bundles</span></div>
  </section>

  <section class="panel hidden" id="results-panel">
    <div class="tabs">
      <button class="tab active" data-tab="transcripts">Transcripts</button>
      <button class="tab" data-tab="bundles">Bundles</button>
      <button class="tab" data-tab="search">Search</button>
      <div class="tabs-spacer"></div>
      <button class="btn btn-ghost btn-sm" id="download-zip-btn">Download all · .zip</button>
    </div>

    <div class="tab-panel" id="tab-transcripts">
      <table class="video-table" id="video-table">
        <thead>
          <tr><th>Title</th><th>Uploaded</th><th>Duration</th><th>Words</th><th>Status</th></tr>
        </thead>
        <tbody id="video-table-body"></tbody>
      </table>
    </div>

    <div class="tab-panel hidden" id="tab-bundles">
      <div class="bundle-grid" id="bundle-grid"></div>
    </div>

    <div class="tab-panel hidden" id="tab-search">
      <div class="search-row">
        <input type="text" id="search-input" placeholder="search everything this channel said&hellip;">
        <label class="opt-check search-scope">
          <input type="checkbox" id="search-all-runs">
          <span>search all runs</span>
        </label>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </section>

  <section class="panel" id="transcript-panel-wrap" style="display:none">
    <div class="transcript-panel-head">
      <h2 id="transcript-title">&nbsp;</h2>
      <div class="format-toggle">
        <button class="format-btn active" data-format="prose">Prose</button>
        <button class="format-btn" data-format="timed">Timestamped</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="close-transcript">Close</button>
    </div>
    <pre class="transcript-body" id="transcript-body"></pre>
  </section>

  <section class="past-runs" id="past-runs">
    <h3>Past runs</h3>
    <div class="run-chips" id="run-chips"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
